<body>
<div id="app"><div class="frame">
  <div class="hud"><div class="titleCard"><h1>现实 VS 游戏：V4.4</h1><p>乐高小人 / 巡查员 / 反预测机制</p></div><div class="stats"><div class="statCard"><div class="label">倒计时</div><div class="value" id="timeValue">01:00:00</div></div><div class="statCard"><div class="label">电脑电量</div><div class="value" id="batteryValue">35%</div><div class="bar"><span id="batteryBar"></span></div></div><div class="statCard"><div class="label">同步率</div><div class="value" id="syncValue">0%</div><div class="bar"><span id="syncBar"></span></div></div></div></div>
  <div class="controlCard"><button onclick="toggleChacha()">智慧查查</button><button onclick="showHelp()">说明</button><button onclick="resetGame()">重置</button></div>
  <div class="appPanel" id="chachaPanel"><h2>智慧查查</h2><div class="sub">空教室 / 异常提交 / 预测日志 / AIGC检查</div><div class="tabs"><button onclick="setChachaTab('rooms')">教室</button><button onclick="setChachaTab('submit')">提交</button><button onclick="setChachaTab('log')">日志</button><button onclick="setChachaTab('ai')">AIGC</button></div><div class="roomList" id="roomList"></div><div class="appActions"><button onclick="toggleChacha()">关闭</button></div></div>
  <div class="mapShell" id="mapShell"><div id="mapViewport"><div id="map"></div></div><div class="predictionBox" id="predictionBox"><b>异常预测日志</b><span id="predictionText">暂无预测。</span></div><div class="bubble" id="bubble">剧情整合版：现在可以推进三线索与四结局。</div><div class="bubble guardBubble" id="guardBubble"></div></div>
  <div class="regionPill" id="regionPill">当前区域：校园总览</div>
  <div class="toast" id="toast">WASD 移动；靠近入口 / 舍友 / 插座 / 源文件 / 终端时按 E 交互。</div>
  <div class="legend"><span class="tag">线索：0/3</span><span class="tag" id="syncStageTag">同步状态：稳定</span><span class="tag">预览源文件：同步 +30%</span></div>

<script>
// ================= 0. DOM 引用与基础工具 =================
let tileSize=30;
const mapEl=document.getElementById('map'),bubbleEl=document.getElementById('bubble'),toastEl=document.getElementById('toast'),regionPill=document.getElementById('regionPill'),modalShade=document.getElementById('modalShade'),mapShell=document.getElementById('mapShell'),chachaPanel=document.getElementById('chachaPanel'),roomList=document.getElementById('roomList'),predictionBox=document.getElementById('predictionBox'),predictionText=document.getElementById('predictionText'),guardBubbleEl=document.getElementById('guardBubble');
// 把异常预测日志移出地图容器，避免遮挡教室。
document.querySelector('.frame').appendChild(predictionBox);
function svgNode(tag,attrs={}){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el}
const BUILDING={corridors:[{x:6,y:4,w:3,h:14},{x:23,y:4,w:3,h:14},{x:6,y:4,w:20,h:3},{x:6,y:17,w:20,h:2},{x:14,y:18,w:4,h:3}],rooms:[
{x:1,y:3,w:5,h:4,type:'free',name:'主南201',socket:true},{x:1,y:8,w:5,h:4,type:'normal',name:'主南202',socket:false},{x:1,y:13,w:5,h:4,type:'used',name:'主南203',socket:true},
{x:9,y:7,w:5,h:4,type:'normal',name:'主M301',socket:false},{x:9,y:12,w:5,h:4,type:'free',name:'主M302',socket:true},{x:9,y:1,w:5,h:3,type:'source',name:'终端室A',socket:false},
{x:18,y:1,w:5,h:3,type:'upload',name:'提交终端室',socket:false},{x:18,y:7,w:5,h:4,type:'normal',name:'主M303',socket:false},{x:18,y:12,w:5,h:4,type:'used',name:'主M304',socket:true},
{x:26,y:3,w:5,h:4,type:'free',name:'主北201',socket:true},{x:26,y:8,w:5,h:4,type:'normal',name:'主北202',socket:false},{x:26,y:13,w:5,h:4,type:'free',name:'主北203',socket:true},
{x:12,y:8,w:2,h:2,type:'small',name:'储物间',socket:false},{x:18,y:8,w:2,h:2,type:'small',name:'值班室',socket:false},{x:14,y:1,w:4,h:3,type:'normal',name:'主201',socket:false}
],doors:[{x:6,y:5},{x:6,y:9},{x:6,y:14},{x:9,y:8},{x:9,y:13},{x:11,y:4},{x:20,y:4},{x:22,y:8},{x:22,y:13},{x:25,y:5},{x:25,y:9},{x:25,y:14},{x:15,y:17},{x:16,y:17}]};
function roomColor(t, revealed=false){
  if(!revealed && ['free','used','normal','source','upload'].includes(t))return '#efc786';
  return t==='free'?'#bfe5a8':t==='used'?'#caa4c9':t==='source'?'#dc6a70':t==='upload'?'#59bfa8':t==='small'?'#dfd0bd':'#efc786';
}
function roomScanActive(){return state.region==='building' && state.roomInfoRevealed && state.elapsedReal < state.roomScanVisibleUntil}
function terminalScanActive(){return state.region==='building' && state.terminalInfoRevealed && state.elapsedReal < state.terminalScanVisibleUntil}
function roomDisplayName(room){
  if(room.type==='source')return terminalScanActive()?'可疑终端室':'主M305';
  if(room.type==='upload')return terminalScanActive()?'提交终端室':'主M306';
  return room.name;
}
function roomIsRevealed(room){
  if(room.type==='source'||room.type==='upload')return terminalScanActive();
  if(['free','used','normal'].includes(room.type))return roomScanActive();
  return true;
}
const REGIONS={campus:{name:'校园总览',cols:24,rows:16,spawn:{x:3,y:3},type:'campus',exits:[{x:11,y:8,to:'park',spawn:{x:3,y:9},text:'你沿着夜色中的小路走进了公园。'},{x:19,y:11,to:'building',spawn:{x:15,y:20},text:'你进入教学楼一层。'}],npcs:[],pois:[]},park:{name:'夜间公园',cols:28,rows:18,spawn:{x:3,y:9},type:'park',exits:[{x:2,y:6,to:'campus',spawn:{x:11,y:8},text:'你离开公园，回到校园总览。'},{x:20,y:16,to:'building',spawn:{x:15,y:20},text:'你穿过公园，来到教学楼入口。'}],npcs:[{id:'roommate',x:13,y:10}],pois:[{type:'clue',x:13,y:10}]},building:{name:'教学楼一层',cols:32,rows:22,spawn:{x:15,y:20},type:'building',exits:[{x:15,y:21,to:'park',spawn:{x:20,y:16},text:'你离开教学楼，回到了公园。'}],npcs:[{id:'guard',x:24,y:5}],pois:[]}};
function buildingPois(){
  const arr=[{type:'exit',x:15,y:21}];
  if(terminalScanActive()){
    arr.push({type:'source',x:11.5,y:2.5});
    arr.push({type:'upload',x:20,y:2.5});
  }
  if(roomScanActive()){
    for(const r of BUILDING.rooms){
      if(r.socket)arr.push({type:'socket',x:r.x+r.w-1.1,y:r.y+r.h-1.1,room:r.name});
    }
  }
  return arr;
}

// ================= 1. 配置、文本与全局数据 =================

  gameTotalMinutes:120,
  gameTotalRealSeconds:600,
  batteryDrainInterval:5,
  batteryDrainAmount:1,
  chachaOpenCost:5,
  roomScanCost:10,
  terminalScanCost:10,
  aigcBatteryCost:20,
  uploadBatteryCost:50,
  chargePerSecond:2,
  predictionDuration:12,
  predictionBaseCooldown:5,
  predictionHitSyncGain:10,
  predictionMissSyncLoss:5,
  scanRevealSeconds:15
};
const STAGE_OPENINGS={"intro": {"title": "第一幕：异常提交", "body": ["屏幕右下角弹出智慧查查通知：", "<div class='line system'><b>智慧查查</b>你的人工智能导论大作业已成功提交。</div>", "你停下敲键盘的手。", "文件还在桌面上，报告还没有写完，你也从未点击过提交。", "可系统页面里，已经出现了一个同名游戏文件：", "<div class='fileBox'>Reality_Game_auto_final.html\n提交时间：21:00:00\n提交状态：成功\n游戏状态：已运行\n游戏日志：玩家将在 21:01 离开宿舍。</div>", "宿舍灯突然灭了。", "楼道里传来几声抱怨，很快又安静下来。", "你的电脑只剩 35% 电量。如果不去教学楼找插座，你仍然没有太多时间撤回那个异常提交版本。"], "tips": ["WASD 移动。", "靠近可交互对象时按 E。", "注意电脑电量和剩余时间。"], "goal": "离开宿舍，穿过公园，前往教学楼。"}, "escape": {"title": "第二幕：夜间出逃", "body": ["你抱着电脑离开宿舍。", "夜风从楼间穿过，屏幕右上角的电量数字仍在缓慢下降。", "系统里那个未知版本仍然显示为“已提交”。更诡异的是，异常预测日志开始续写你的行动。", "<div class='fileBox'>异常报告：\n玩家将穿过公园，进入教学楼寻找可用插座。</div>", "你突然意识到，它不是在记录过去。", "它是在提前写下你接下来可能会做什么。"], "tips": ["留意屏幕上的异常预测日志。", "预测日志会不断更新你的可能行动。", "你可以选择立刻照做，也可以先观察、绕路或等待。"], "goal": "穿过公园，寻找前往教学楼的入口。"}, "roommate": {"title": "第三幕：公园舍友", "body": ["公园的小路被路灯切成一段一段。", "你看见舍友站在路边，像是刚从图书馆回来。", "他看见你抱着电脑，先是一愣，随后问：", "<div class='line npc'><b>舍友</b>这么晚了，还要去教学楼？</div>", "你正想解释宿舍停电和异常提交，却忽然想起：异常报告刚刚写下，你会在公园里遇到舍友。"], "tips": ["靠近舍友后按 E，可以逐句推进对话。", "对话不会一次性全部显示，请继续按 E 阅读。", "如果不想继续对话，也可以先离开。"], "goal": "与舍友对话，判断他是否知道异常提交的事。"}, "building": {"title": "第四幕：教学楼充电", "body": ["你进入教学楼一层。", "走廊灯并没有完全熄灭，只是亮得很低，像是被人刻意调暗。", "教室门牌还在，但门口的电子屏大多显示异常。你看不出哪间教室空闲，也看不见哪里有插座。", "智慧查查弹出提示：", "<div class='line system'><b>智慧查查</b>检测到附近存在可用教室与插座。是否运行教室与插座扫描？</div>", "这一次，你很清楚它能帮你节省时间。", "但异常预测日志也正等着你照它写下的方式行动。"], "tips": ["教室初始状态并不可靠，需要借助智慧查查确认。", "打开智慧查查可以查看查询面板。", "运行教室与插座扫描后，部分教室和插座会被临时标记。", "标记只会保留一段时间，请记住位置后尽快行动。", "靠近插座后按住 E，可以为电脑充电。"], "goal": "找到空闲教室和插座，将电脑电量恢复到可以继续行动的程度。"}, "source": {"title": "第五幕：异常源文件", "body": ["电脑电量终于回到安全线以上。", "你可以继续处理异常提交了。", "但教学楼里每间教室看起来都差不多。源文件终端伪装成一间普通教室，像是故意等你走错方向。", "智慧查查的提交记录里出现了新的空白项：", "<div class='fileBox'>终端位置：未知。</div>", "你可以运行终端扫描，也可以凭记忆和直觉一间间找。"], "tips": ["普通教室中可能隐藏着特殊终端。", "运行终端扫描后，可疑终端会被临时标记。", "标记不会永久保留，请记住位置后尽快前往。", "靠近可疑终端后按 E，可以尝试打开文件管理器。"], "goal": "定位异常源文件终端，查看异常提交背后的文件记录。"}, "aigc": {"title": "第六幕：AIGC 检查", "body": ["源文件目录里出现了 prompt_history.txt。", "你已经知道，这个异常游戏并不只是系统事故。", "智慧查查忽然弹出新的异常提示：", "<div class='line system'><b>智慧查查</b>当前条件允许进行 AIGC 检查。</div>", "这项检查可能确认异常文件的生成来源。", "但它会消耗大量电量，而且检查结果一旦出现，你就不能再假装这只是一个偶然错误。"], "tips": ["你可以在智慧查查中选择是否运行 AIGC 检查。", "检查会消耗较多电量。", "如果暂时不想检查，可以关闭提示，继续探索或补充电量。"], "goal": "决定是否运行 AIGC 检查，进一步确认异常文件的来源。"}, "terminal": {"title": "第七幕：提交终端", "body": ["提交终端终于被定位。", "屏幕上显示着两个版本：", "<div class='fileBox'>异常提交版本：Reality_Game_auto_final.html\n真实游戏版本：index.html</div>", "它们的文件名几乎一样，像是现实和游戏互相覆盖后留下的重影。", "终端等待你的操作。", "你还没有完全确定自己理解了这一切，但时间和电量都不会等你。"], "tips": ["靠近提交终端后按 E，可以打开提交界面。", "提交界面会根据你当前掌握的信息显示可选操作。", "不同选择会导向不同结果，请在确认后再操作。"], "goal": "在提交终端前做出选择，处理异常提交版本。"}, "returnDorm": {"title": "第八幕：返回宿舍", "body": ["上传完成。", "系统提示异常提交版本已被覆盖。", "教学楼重新安静下来，像是什么都没有发生过。可异常预测日志并没有立刻消失，它只是停止了续写。", "你需要回到宿舍，确认现实是否恢复。", "如果一切顺利，这件事会像一次深夜赶作业的事故，被你含糊地归档为“还好赶上了”。", "至于异常游戏到底从哪里来，也许你永远不会再追问。"], "tips": ["沿原路返回宿舍。", "路上仍然需要注意电量和时间。", "回到宿舍区域后，确认现实状态。"], "goal": "返回宿舍，确认现实是否恢复。"}};
const ENDING_SCENES={"BATTERY": {"title": "BE：电脑电量归零", "html": "<h2>BE：电脑电量归零</h2><p>屏幕忽然暗了下去。</p><p>风扇声停止，键盘背光熄灭，最后一点亮光从电量图标上消失。</p><p>你愣了几秒，才想起自己还没上传真实游戏，也还没撤回那个异常提交版本。</p><p>黑暗里，一切重新安静下来。</p><p>你以为事情会到此为止。</p><p>第二天早上，手机闹钟还没有响，你却准时睁开了眼。</p><p>6:30。</p><p>你平时怎么也起不来的早八时间。</p><p>桌面上，已经关机的电脑不知何时重新亮起。屏幕中央停着一行新的游戏日志：</p><div class='fileBox'>由于早八，玩家需要在 6:30 起床。\n玩家已按时起床。\n现实同步稳定。</div><p>你坐在床上，忽然意识到：</p><p>昨晚失败的并不是游戏。</p><p>是现实失去了最后一次反抗的机会。</p>"}, "TIME": {"title": "BE：DDL 结束", "html": "<h2>BE：DDL 结束</h2><p>23:00。</p><p>智慧查查的倒计时归零。</p><p>屏幕上没有爆炸，没有红色警告，也没有任何夸张的失败动画。</p><p>只有一条普通得不能再普通的系统提示：</p><div class='fileBox'>提交通道已关闭。\n最终提交版本：Reality_Game_auto_final.html</div><p>你盯着那行字，忽然觉得它甚至有点合理。</p><p>毕竟系统记录显示，作业早在 21:00 就已经成功提交。</p><p>你的迟疑、奔跑、充电、查询、怀疑，都没有被写进最终记录。</p><p>几秒后，异常预测日志自动补全最后一行：</p><div class='fileBox'>玩家未能在截止时间前覆盖异常版本。\n现实将以已提交版本为准继续运行。</div><p>第二天课堂上，老师表扬了你的“大作业创意”。</p><p>同学们都说那个游戏很有意思。</p><p>只有你知道：</p><p>你根本没有完成它。</p><p>它完成了你。</p>"}, "SYNC": {"title": "BE：完全同步", "html": "<h2>BE：完全同步</h2><p>同步率达到 100%。</p><p>这一刻，游戏没有再预测你的行动。</p><p>它开始陈述事实。</p><div class='fileBox'>玩家停下脚步。\n玩家看向屏幕。\n玩家意识到自己已经来不及了。</div><p>你想移开视线，却发现自己的动作和日志里的每一个字严丝合缝。</p><p>不是它写得准。</p><p>是现实终于学会了按它写的方式发生。</p><p>教学楼的走廊变得过分整齐。教室门牌、插座位置、智慧查查提示、作业提交状态，全都像被同一个系统重新排版过。</p><p>你听见身后传来巡查员的声音：</p><div class='line system'><b>巡查员</b>同学，现在该休息了。</div><p>这句话平静、礼貌、没有恶意。</p><p>正因为如此，才更像一条不可违抗的系统规则。</p><p>屏幕上，最后一行日志缓慢浮现：</p><div class='fileBox'>玩家未能阻止同步。\n从现在起，现实将不再需要玩家确认。</div><p>你终于明白，最可怕的不是游戏入侵现实。</p><p>而是现实变得像游戏一样顺滑、高效、合理，并且不再给你留下迟疑的空间。</p>"}, "GIVEUP": {"title": "BE：异常保留", "html": "<h2>BE：异常保留</h2><p>你没有按下覆盖按钮。</p><p>也许是电量不够，也许是时间太紧，也许只是因为你忽然觉得：</p><p>反正系统已经显示提交成功了。</p><p>反正老师只会看到最终文件。</p><p>反正这个异常游戏看起来也没有立刻伤害谁。</p><p>你合上电脑，离开教学楼。</p><p>身后的提交终端没有发出警报，只是安静地保存了当前状态。</p><div class='fileBox'>异常版本：保留\n真实版本：未覆盖\n现实同步：继续</div><p>第二天，你发现不只是自己的作业页面发生了变化。</p><p>隔壁同学的课程报告里，多出了一段他从未写过的总结。</p><p>班群里，有人说自己的实验截图提前生成好了。</p><p>甚至连老师发布的通知，都开始像某种自动续写的文本：</p><div class='fileBox'>请各位同学按照系统推荐路径完成学习任务。\n无需重复确认。</div><p>你忽然想起昨晚那个按钮。</p><p>不是你没有机会处理异常。</p><p>是你亲手把它留在了现实里。</p>"}, "HE": {"title": "HE：覆盖成功", "html": "<h2>HE：覆盖成功</h2><p>你回到宿舍时，电已经恢复了。</p><p>室友翻了个身，楼道重新亮起，桌上的水杯、书、充电线和散落的草稿纸都回到熟悉的位置。</p><p>电脑屏幕上，智慧查查显示：</p><div class='fileBox'>异常提交版本已覆盖。\n当前提交文件：index.html\n提交状态：成功</div><p>你长长地松了一口气。</p><p>至少作业保住了。</p><p>至少系统页面恢复正常了。</p><p>至少今晚发生的一切，都可以被解释成一次奇怪的缓存错误、一次网页异常、一次 AI 生成代码留下的 bug。</p><p>你没有继续翻看那些记录。</p><p>也没有继续追问，那个异常游戏最初为什么会知道你要做什么。</p><p>第二天，你把项目链接和报告一起交了上去。</p><p>展示时，老师说你的创意很有意思：</p><div class='line npc'><b>老师</b>AI 生成的游戏反过来影响现实，这个设定很有想法。</div><p>你笑了笑，说：</p><div class='line player'><b>玩家</b>是的，只是一个概念设计。</div><p>屏幕上，智慧查查的图标安静地停在右下角。</p><p>没有弹窗。</p><p>没有预测。</p><p>也没有新的日志。</p><p>可是从那以后，每当你准备让 AI “直接帮我生成完整版本”时，你都会迟疑一秒。</p><p>也许这已经足够了。</p>"}, "TE": {"title": "TE：恢复真实", "html": "<h2>TE：恢复真实</h2><p>你按下覆盖按钮。</p><p>终端没有立刻响应。</p><p>几秒钟里，屏幕上不断闪过你曾经输入过的需求、修改意见和确认语句：</p><div class='fileBox'>帮我直接生成可以运行的版本。\n再加一个同步率。\n舍友要随机友好或敌对。\n异常报告要预测玩家下一步行动。\n结局要有 TE、HE、BE、OE。</div><p>你突然明白，异常游戏并不是某个外来的怪物。</p><p>它是你一次次提出需求、一次次跳过理解、一次次接受生成结果后，留下来的影子。</p><p>它最了解你，不是因为它比你更像人。</p><p>而是因为你把太多还没有想清楚的东西交给了它。</p><p>上传进度缓慢推进。</p><div class='fileBox'>正在覆盖异常版本……\n正在删除自动续写日志……\n正在断开现实同步……</div><p>同步率开始下降。</p><p>教学楼恢复成普通的夜晚。走廊不再像被脚本安排过的路线，教室门牌也只是教室门牌。</p><p>智慧查查最后弹出一条提示：</p><div class='fileBox'>检测到玩家正在偏离最优路径。\n是否重新生成建议？</div><p>你没有点击。</p><p>你只是合上电脑，站在走廊里等了一会儿。</p><p>现实重新变得麻烦、迟缓、不够高效。</p><p>你仍然要自己写报告，自己修改代码，自己面对不够完美的作品。</p><p>但也正因为如此，它重新变成了你的现实。</p><p>第二天，你打开空白文档，在报告最后写下：</p><div class='line player'><b>玩家</b>AI 可以帮助我生成作品，但不能替我承担选择。</div><p>这一次，句子是你自己写的。</p>"}, "OE": {"title": "OE：幕后操盘手", "html": "<h2>OE：幕后操盘手</h2><p>你没有覆盖异常游戏。</p><p>相反，你打开了同步规则文件。</p><p>那一瞬间，同步率直接跳到 100%。</p><p>按照原本的规则，你应该失败。</p><p>可是这一次，屏幕没有变黑，也没有出现“游戏结束”。</p><p>终端只是安静地询问：</p><div class='fileBox'>是否由玩家接管同步规则？</div><p>你点击了确认。</p><p>整个教学楼像是轻轻震动了一下。走廊、教室、插座、终端、智慧查查、异常预测日志，全都重新排列成你可以阅读的格式。</p><p>你第一次不是被日志预测。</p><p>你在写日志。</p><div class='fileBox'>玩家将返回宿舍。\n玩家将按时完成报告。\n玩家将在展示中获得认可。\n玩家将不再浪费时间。</div><p>这些句子看起来太诱人了。</p><p>它们不像命令。</p><p>它们像一个终于懂你的人，替你把混乱的人生整理成了清晰任务。</p><p>第二天，现实变得顺滑起来。</p><p>你不再拖延。课程资料自动归档。作业自动排期。食堂总是推荐你最该吃的窗口。图书馆总能把最合适的资料推到你面前。</p><p>所有人都说，你最近状态好极了。</p><p>你也这么觉得。</p><p>直到某天深夜，屏幕右下角弹出一条新的智慧查查通知：</p><div class='fileBox'>玩家将相信自己成为了幕后操盘手。</div><p>你盯着那行字很久。</p><p>然后你发现，自己的手已经按下了确认。</p>"}};

const GAME_TOTAL_MINUTES=CONFIG.gameTotalMinutes;
const GAME_TOTAL_REAL_SECONDS=CONFIG.gameTotalRealSeconds;
const state={region:'campus',pos:{x:3,y:3},keys:new Set(),holdingInteract:false,modalOpen:true,started:false,gameOver:false,elapsedReal:0,battery:35,sync:0,stage:0,hasSource:false,uploaded:false,isCharging:false,chargingRoom:null,chargeAcc:0,chachaTab:'rooms',roommateRole:Math.random()<0.5?'friend':'enemy',roommateTalk:0,roommateLineText:'',clues:{roommate:false,source:false,ai:false,guard:false},prediction:null,predictionCooldown:5,predictionLog:[],roomInfoRevealed:false,terminalInfoRevealed:false,roomScanVisibleUntil:0,terminalScanVisibleUntil:0,lastRoomScanResult:[],lastTerminalScanResult:[],predictionBrokenCount:0,predictionHitCount:0,guard:{mode:'patrol',x:24,y:5,pathIndex:0,alertTimer:0,chaseTimer:0,searchTimer:0,caughtCount:0,line:'',dialogue:null},scene:{park:false,roommate:false,building:false,source:false,terminal:false,aigcPrompt:false},toast:'WASD 移动；靠近入口 / 舍友 / 插座 / 源文件 / 终端时按 E 交互。'};
function closeModal(){state.modalOpen=false;modalShade.style.display='none';if(!state.started){state.started=true;state.toast='游戏开始：21:00。当前任务：穿过公园，进入教学楼寻找插座。'}updateBubble()}window.closeModal=closeModal;
function showModal(html){state.modalOpen=true;document.getElementById('modal').innerHTML=html;modalShade.style.display='grid'}

function renderStageOpeningHTML(key){
  const data=STAGE_OPENINGS[key];
  if(!data)return '<h2>提示</h2><p>继续探索。</p>';
  const body=data.body.map(p=>p.startsWith('<')?p:`<p>${p}</p>`).join('');
  const tips=data.tips&&data.tips.length?`<div class="fileBox">操作提示：\n${data.tips.map(x=>'· '+x).join('\n')}</div>`:'';
  const goal=data.goal?`<p><b>当前目标：</b>${data.goal}</p>`:'';
  return `<h2>${data.title}</h2>${body}${tips}${goal}`;
}
function showStageOpening(key,buttonText='继续'){
  showModal(`<div class="modal">${renderStageOpeningHTML(key)}<div class="actions"><button class="good" onclick="closeModal()">${buttonText}</button></div></div>`);

function moveGuardToward(target,dt,speed){
  const dx=target.x-state.guard.x,dy=target.y-state.guard.y,dist=Math.hypot(dx,dy);
  if(dist<0.03)return true;
  const step=Math.min(speed*dt,dist);
  state.guard.x+=dx/dist*step;
  state.guard.y+=dy/dist*step;
  const el=getEntity('guard');
  if(el)setEntityPos(el,state.guard.x,state.guard.y);
  return dist<0.15;
}
function setGuardLine(text){
  if(state.guard.line===text)return;
  state.guard.line=text||'';
  updateGuardBubble();
}
function showGuardClue(){
  startGuardClueDialogue();
}
function guardCatchPlayer(){
  state.guard.caughtCount++;
  if(!state.clues.guard){
    showGuardClue();
    return;
  }
  if(state.guard.caughtCount===2){
    adjustSync(5);
    state.toast='巡查员记录了你的异常停留：同步率 +5%。';
  }else{
    adjustSync(10);
    state.toast='巡查员将你带回教学楼入口：同步率 +10%。';
    state.pos={x:15,y:20};
    const player=getEntity('player');if(player)setEntityPos(player,state.pos.x,state.pos.y);
  }
  state.guard.mode='search';state.guard.searchTimer=4;setGuardLine('巡查员：别在教室里熬太晚，系统会记录学习状态。');
  updateBubble();
}
function updateGuard(dt){
  if(state.region!=='building')return;
  if(!state.guard) return;
  const g=state.guard;
  if(g.mode==='dialogue'){updateGuardBubble();return;}
  if(g.mode==='patrol'){
    const target=GUARD_PATH[g.pathIndex%GUARD_PATH.length];
    if(moveGuardToward(target,dt,1.35))g.pathIndex=(g.pathIndex+1)%GUARD_PATH.length;
    if(guardCanSeePlayer()){
      g.mode='alert';g.alertTimer=2;setGuardLine('巡查员：同学？这么晚了还在教学楼？');
    }
  }else if(g.mode==='alert'){
    g.alertTimer-=dt;
    if(!guardCanSeePlayer()){
      g.mode='search';g.searchTimer=2.5;setGuardLine('巡查员：注意作息，别在教学楼逗留太久。');
    }else if(g.alertTimer<=0){
      g.mode='chase';g.chaseTimer=7;setGuardLine('巡查员：同学，请先停一下。');
    }
  }else if(g.mode==='chase'){
    g.chaseTimer-=dt;
    moveGuardToward(state.pos,dt,3.15);
    if(guardDistance()<0.75){guardCatchPlayer();return;}
    if(playerInBuildingRoom()||g.chaseTimer<=0||guardDistance()>6.5){
      g.mode='search';g.searchTimer=4;setGuardLine('巡查员：别躲在教室里熬太晚，系统会记录学习状态。');
    }
  }else if(g.mode==='search'){
    g.searchTimer-=dt;
    if(g.searchTimer<=0){g.mode='patrol';setGuardLine('');state.toast=currentTask();updateBubble();}
  }
  const el=getEntity('guard');
  if(el){setEntityPos(el,g.x,g.y);el.classList.remove('guard-mode-patrol','guard-mode-alert','guard-mode-chase','guard-mode-search','guard-mode-dialogue');el.classList.add('guard-mode-'+g.mode);}
  updateGuardBubble();
}

function movementVector(){let dx=0,dy=0;if(state.keys.has('w')||state.keys.has('arrowup'))dy--;if(state.keys.has('s')||state.keys.has('arrowdown'))dy++;if(state.keys.has('a')||state.keys.has('arrowleft'))dx--;if(state.keys.has('d')||state.keys.has('arrowright'))dx++;return{dx,dy}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();state.keys.add(k)}if(k==='e'&&!state.modalOpen&&!state.gameOver){state.holdingInteract=true;interact()}if(k==='escape')showHelp()});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();state.keys.delete(k);if(k==='e'){state.holdingInteract=false;if(state.isCharging){state.toast='你松开了 E，充电暂停。';updateBubble()}}});window.addEventListener('resize',()=>renderRegion());

function updateScanExpiry(){
  let changed=false;
  if(state.roomInfoRevealed && state.roomScanVisibleUntil>0 && state.elapsedReal>=state.roomScanVisibleUntil){state.roomInfoRevealed=false;state.roomScanVisibleUntil=0;changed=true;}
  if(state.terminalInfoRevealed && state.terminalScanVisibleUntil>0 && state.elapsedReal>=state.terminalScanVisibleUntil){state.terminalInfoRevealed=false;state.terminalScanVisibleUntil=0;changed=true;}
  if(changed&&state.region==='building'){renderRegion();state.toast='智慧查查的地图标记已淡出。文字查询结果仍保留在面板中。';}
}

let last=performance.now(),batteryAcc=0;function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state.started&&!state.modalOpen&&!state.gameOver){state.elapsedReal+=dt;updatePrediction(dt);updateScanExpiry();updateGuard(dt);batteryAcc+=dt;if(batteryAcc>=CONFIG.batteryDrainInterval){batteryAcc-=CONFIG.batteryDrainInterval;adjustBattery(-CONFIG.batteryDrainAmount)}if(state.isCharging){const socket=nearActualSocket(1.4);if(socket&&state.holdingInteract){state.chargeAcc+=dt;if(state.chargeAcc>=1){state.chargeAcc-=1;adjustBattery(CONFIG.chargePerSecond);state.toast=`正在使用 ${state.chargingRoom||'教室'} 的插座充电：现实每秒 +${CONFIG.chargePerSecond}%。`;if(state.stage===1&&state.battery>=50){state.stage=2;state.toast='电量已超过 50%。下一步：寻找异常源文件。';if(!state.scene.source){state.scene.source=true;showStageOpening('source');}}}}else if(socket&&!state.holdingInteract){state.chargeAcc=0}else{state.isCharging=false;state.chargingRoom=null;state.chargeAcc=0;state.toast='你离开了插座，充电中断。'}}if(state.elapsedReal>=GAME_TOTAL_REAL_SECONDS)endGame('TIME')}if(!state.modalOpen&&!state.gameOver){const{dx,dy}=movementVector();moveContinuous(dx,dy,dt)}if(!state.gameOver&&state.uploaded&&state.region==='campus'&&state.pos.x<=5&&state.pos.y<=5)endGame('HE');updateHud();requestAnimationFrame(loop)}
showStageOpening('intro','正式开始');
renderRegion();updateHud();requestAnimationFrame(loop);
</script>
</body>
